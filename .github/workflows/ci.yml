name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      # Types are a property of the code, not of the interpreter checking it, so
      # this runs once rather than three times. It also has to: see the note on
      # `python_version` in pyproject.toml.
      - name: Types
        if: matrix.python == '3.13'
        run: mypy src/griff

      # No test renders. The environments are constructed with cameras=() so the
      # suite needs MuJoCo's physics but never a GL context, which is what lets
      # it run on a headless runner without EGL or a virtual framebuffer.
      - name: Tests
        run: pytest -m "not slow" --cov=griff --cov-report=term-missing

      - name: Slow tests
        if: matrix.python == '3.13'
        run: pytest -m slow

  results:
    # results/RESULTS.md is generated. If it and results.json ever disagree, the
    # published tables stop describing the runs that produced them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'

      - name: RESULTS.md is regenerated, not hand-edited
        run: |
          griff report
          git diff --exit-code results/RESULTS.md \
            || { echo "::error::results/RESULTS.md is out of sync with results.json. Run 'griff report'."; exit 1; }

      - name: The committed demo datasets still conform to LeRobot v2.1
        run: |
          for dataset in datasets/demo-*; do
            griff validate-dataset "$dataset"
          done

  train-smoke:
    # Trains for 30 steps on the committed demo datasets and rolls the result
    # out once. It cannot tell you a policy is good; it can tell you the
    # train -> checkpoint -> load -> act path still works end to end, which is
    # the part that breaks silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'

      - name: Train, checkpoint, roll out
        run: |
          python - <<'PY'
          from griff.policies import PolicyConfig
          from griff.train import train
          from griff.evaluate import evaluate_actor, _PolicyActor
          from griff.calibrate import load_or_fit
          from griff.sim import make_env

          for kind in ("act", "diffusion"):
              config = PolicyConfig(kind=kind, conditioning="vision_force",
                                    steps=30, batch_size=8, warmup_steps=5)
              report = train("peg_insert", config,
                             dataset_root="datasets/demo-peg_insert",
                             output_dir=f"runs/_ci/{config.name}", progress=False)
              assert report.parameters > 0
              env = make_env("peg_insert", render=False, cameras=(),
                             calibration=load_or_fit("peg_insert"))
              env.close()
              print(f"{kind}: {report.parameters:,} params, loss {report.final_loss:.3f}")
          PY

  ros:
    # The ROS 2 packages have never been run on hardware. Building them in CI is
    # the only claim this repo makes about them, and this job is that claim.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      # griff_policy is deliberately not in this list: it imports `griff`, which
      # needs torch and MuJoCo in the ROS Python environment. Installing a
      # training stack into a ROS job to check two nodes is not a trade worth
      # making; they are linted and type-checked by the `test` job above.
      #
      # `colcon test` here runs one thing: the gtest in griff_control, which
      # asserts the same force bound as the Python suite against the same wall
      # model. The ament style linters are not enabled -- see the note in
      # ros2_ws/src/griff_control/CMakeLists.txt.
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: griff_msgs griff_description griff_control griff_bringup
          target-ros2-distro: jazzy
          vcs-repo-file-url: ""
