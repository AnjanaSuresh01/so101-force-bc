# MoveIt Servo, for jogging the arm around a policy run.
#
# Servo is not on the policy's path. It publishes joint commands into the same
# guarded controller, so a human jogging the arm into a fixture is subject to
# the same force limit the policy is.
#
# The singularity thresholds are low because this arm has a real one in its
# working volume: with the tool held vertical over the bench fixtures the
# shoulder is close to full extension.

/**:
  ros__parameters:
    move_group_name: arm
    planning_frame: base_link
    ee_frame_name: tool_centre
    robot_link_command_frame: base_link

    command_in_type: unitless
    scale:
      linear: 0.3
      rotational: 0.6
      joint: 0.4

    publish_period: 0.0334  # 30 Hz, matching the controller
    command_out_type: sensor_msgs/JointState
    publish_joint_positions: true
    publish_joint_velocities: false
    publish_joint_accelerations: false
    command_out_topic: /griff/policy_command

    smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin

    low_latency_mode: false
    incoming_command_timeout: 0.2
    num_outgoing_halt_msgs_to_publish: 4

    lower_singularity_threshold: 17.0
    hard_stop_singularity_threshold: 30.0
    joint_limit_margin: 0.05

    check_collisions: true
    collision_check_rate: 10.0
    self_collision_proximity_threshold: 0.005
    scene_collision_proximity_threshold: 0.01
